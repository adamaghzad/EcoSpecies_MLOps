[project]
name = "ecospecies-mlops"
version = "1.0.0"
description = "Cours et laboratoire MLOps de bout en bout"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2", "mlflow>=3.1,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pytest>=8,<10", "httpx>=0.27,<1", "pandera[pandas]>=0.24,<1", "prometheus-client>=0.21,<1", "evidently>=0.7,<0.8", "prefect>=3,<4", "dvc>=3,<4", "pyyaml>=6,<7", "requests>=2.32,<3"]
[tool.poetry]
package-mode = false
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
